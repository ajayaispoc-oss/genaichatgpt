name: Deploy to Firebase Hosting and Functions
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Build frontend
      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_WEBHOOK_URL: ${{ secrets.VITE_WEBHOOK_URL }}

      # Build functions
      - name: Install functions dependencies
        run: cd functions && npm ci

      - name: Build functions
        run: cd functions && npm run build

      # Set Firebase environment config for Cloud Functions
      - name: Set Firebase Function Config
        run: |
          firebase functions:secrets:set WEBHOOK_URL --data-file <(echo -n "${{ secrets.WEBHOOK_URL }}") --force || true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # Deploy to Firebase
      - name: Deploy to Firebase
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting,functions --project genaichatgpt-a7734
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
